---
- name: Read the kubeconfig from the k3s server
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  delegate_to: "{{ groups['role_k3s'][0] }}"
  become: true
  register: k3s_kubeconfig

- name: Create the .kube directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0700"
  loop: "{{ jenkins_kubeconfig_owners }}"

- name: Install a kubeconfig that points at the k3s private IP
  ansible.builtin.copy:
    dest: "{{ item.path }}/config"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0600"
    content: "{{ k3s_kubeconfig.content | b64decode | replace('https://127.0.0.1:6443', 'https://' ~ hostvars[groups['role_k3s'][0]]['private_ip_address'] ~ ':6443') }}"
  loop: "{{ jenkins_kubeconfig_owners }}"
