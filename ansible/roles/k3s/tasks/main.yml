---
- name: Check whether k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Install k3s server (Traefik ingress, metrics-server and local-path storage are included)
  ansible.builtin.shell: >-
    set -o pipefail &&
    curl -sfL https://get.k3s.io |
    INSTALL_K3S_VERSION='{{ k3s_version }}' sh -s - server --write-kubeconfig-mode 644
  args:
    executable: /bin/bash
  when: not k3s_binary.stat.exists

- name: Make sure the k3s service is enabled and running
  ansible.builtin.service:
    name: k3s
    enabled: true
    state: started

- name: Wait for the node to become Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
  changed_when: false
